[project]
name = "prism-t-engine"
version = "0.1.0"
description = "Deterministic physics restoration, deep-fusion unmixing, and SDF typesetting engine for Prism-T"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
    "fonttools>=4.55.0",
    "pydantic>=2.9.0",
    "rapidocr-onnxruntime>=1.4.0",
    "onnxruntime-gpu>=1.20.0,<1.27.0",
    "torch>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism_t_engine"]

[tool.uv]
override-dependencies = [
    "onnxruntime; sys_platform == 'never'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
